id = "shepr"
name = "shepr"
version = "0.2.0"
description = "A group chat for the agents in a tab."
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]

[[build]]
command = ["go", "build", "-o", "shepr", "./cmd/shepr"]

[[panes]]
id = "chat"
title = "shepr chat"
placement = "split"
command = ["./shepr", "chat"]

[[actions]]
id = "open"
title = "shepr: open chat"
contexts = ["workspace", "tab", "pane"]
command = ["./shepr", "open"]
